<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول - التبرع بالدم</title>
  <link rel="stylesheet" href="loginForm.css">
</head>
<body>








  <div class="login-container">
    <h2>تسجيل الدخول</h2>
    <form id="loginForm">
      <label for="email">البريد الإلكتروني:</label>
      <input type="email" id="email" name="email" required>

      <label for="password">كلمة المرور:</label>
      <input type="password" id="password" name="password" required>

      <button type="submit">تسجيل الدخول</button>

      <p class="extra-text">هل نسيت كلمة المرور؟ <a href="#">استرجاع</a></p>
      <p class="extra-text">ليس لديك حساب؟ <a href="#">إنشاء حساب</a></p>
    </form>

    <div id="loginMessage" class="message-success" style="display: none;">
      <!-- ستظهر الرسالة هنا -->
    </div>
  </div>

  <script src="loginForm.js"></script>
</body>
</html>
